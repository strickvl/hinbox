[project]
name = "hinbox-dspy-opt"
version = "0.1.0"
description = "DSPy prompt-optimisation experiments for Hinbox (kept out of the main environment)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "hinbox",
    "dspy==3.4.1",
]

[project.optional-dependencies]
anthropic = ["anthropic>=0.40"]

[tool.uv]
package = false
# DSPy lists LiteLLM as a dependency on Python < 3.15, but its built-in "lm15"
# engine calls OpenAI, Anthropic, Gemini and Ollama directly. The override's
# marker (Python 2) can never be true, so LiteLLM is never locked, downloaded
# or installed.
override-dependencies = ["litellm; python_version < '3'"]

[tool.uv.sources]
hinbox = { path = "../..", editable = true }
