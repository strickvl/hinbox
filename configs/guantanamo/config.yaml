domain: "guantanamo"
description: "Guantánamo Bay detention and related issues"

# Data source configuration
data_sources:
  default_path: "data/guantanamo/raw_sources/miami_herald_articles.parquet"

# Output configuration  
output:
  directory: "data/guantanamo/entities"

# Prompt variants by model. For a model whose name contains one of a
# family's parts, a prompt file named <prompt>.<family>.md (for example
# relevance.qwen.md) is used instead of <prompt>.md. Families are tried in
# order, then "local" (ollama/ models) or "cloud". Add a variant only when the
# eval shows it beats the default for that model (`just eval show --grid`).
prompt_families:
  qwen: [qwen]
  bolt: [bolt, nemotron]

# Legacy similarity threshold (superseded by dedup section below)
similarity_threshold: 0.75

# Deduplication configuration
dedup:
  similarity_thresholds:
    default: 0.75
    people: 0.82
    organizations: 0.78
    locations: 0.80
    events: 0.76
  lexical_blocking:
    enabled: true
    threshold: 60        # RapidFuzz score cutoff (0-100)
    max_candidates: 50   # max entities to run cosine similarity against
  name_variants:
    organizations:
      equivalence_groups:
        - ["Department of Defense", "Defense Department", "DoD", "Pentagon"]
        - ["Department of Justice", "Justice Department", "DoJ"]
        - ["Department of Homeland Security", "Homeland Security", "DHS"]
        - ["Department of State", "State Department"]
        - ["Immigration and Customs Enforcement", "ICE"]
        - ["Customs and Border Protection", "CBP"]
        - ["Central Intelligence Agency", "CIA"]
        - ["Federal Bureau of Investigation", "FBI"]
        - ["National Security Agency", "NSA"]
        - ["Defense Intelligence Agency", "DIA"]
        - ["Joint Task Force Guantanamo", "JTF-GTMO", "JTF GTMO"]
        - ["American Civil Liberties Union", "ACLU"]
        - ["International Committee of the Red Cross", "ICRC", "Red Cross", "International Red Cross"]
        - ["United Nations", "UN", "U.N."]
        # Also tell the misfiled-locations filter these are not places.
        - ["Islamic State", "ISIS", "ISIL", "Islamic State of Iraq and Syria"]
        - ["Syrian Democratic Forces", "SDF"]
        - ["al-Qaida", "al-Qaeda", "al Qaida", "al Qaeda"]
        - ["U.S. Senate", "Senate"]
        - ["U.S. Congress", "Congress"]
        - ["Office of Military Commissions", "OMC"]
    locations:
      equivalence_groups:
        # The bay/prison and the naval base are kept as separate groups: these
        # names only send a pair to the match check, they never merge it alone.
        - ["Guantanamo Bay", "Guantanamo", "GTMO", "Gitmo"]
        # A bare "Navy base"/"U.S. Navy base" is left out on purpose: the merge
        # gold labels "U.S. Navy base" vs this base as different.
        - ["Naval Station Guantanamo Bay", "Guantanamo Bay Naval Base", "Guantanamo Bay Navy Base", "Guantanamo naval base", "Guantanamo Navy Base"]
        - ["United States", "U.S.", "US"]

# Performance / concurrency configuration
performance:
  concurrency:
    extract_workers: 8        # parallel articles in extraction phase
    extract_per_article: 4    # parallel entity types within article
    llm_in_flight: 16         # max concurrent cloud LLM calls
    ollama_in_flight: 4       # max concurrent local LLM calls (match the server's parallel slots)
    merge_parallel_types: 4   # entity types merged at once within an article
    grounding_workers: 8      # profiles grounding-checked at once
  queue:
    max_buffered_articles: 32  # backpressure limit for extraction -> merge

# Batching configuration (for embedding calls during merge)
batching:
  embed_batch_size: 64        # texts per embedding API call
  embed_drain_timeout_ms: 100 # reserved for future async drain behaviour

# Caching configuration (Phase 4 speed audit)
cache:
  enabled: true
  embeddings:
    lru_max_items: 4096         # in-memory LRU for embedding vectors
  extraction:
    enabled: true
    subdir: "cache/extractions"  # persistent sidecar under output dir
    version: 2                   # bumped: LiteLLM → OpenAI/Anthropic SDK transport
  match_check:
    enabled: true
    max_items: 8192              # per-run LRU for match-checker results
  articles:
    skip_if_unchanged: true      # skip articles whose content hash hasn't changed

# Merge evidence configuration (for evidence-first similarity search)
merge_evidence:
  max_chars: 1500         # truncate evidence text to this length
  window_chars: 240       # characters per context window around entity mentions
  max_windows: 3          # max context windows to extract from article

# Profiles
profiles:
  # Entity kinds whose profile is frozen after the first article: a later
  # article is linked to the entity but makes no profile update and adds no
  # text (src/engine/hub_profiles.py). Meant for hubs named in passing by most
  # articles. Keys are entity tables, values are their `type` values.
  # HINBOX_HUB_LINK_ONLY=off turns it off.
  link_only:
    locations: [country, region]

# Processing configuration
processing:
  # Enable relevance checking before extraction
  relevance_check: true
  
  # Batch size for processing articles
  batch_size: 5

# Embeddings configuration
embeddings:
  mode: cloud  # Options: auto, local, cloud, hybrid
  cloud:
    model: jina_ai/jina-embeddings-v3
    batch_size: 100
    max_retries: 3
    timeout: 30
  local:
    model: sentence-transformers/all-MiniLM-L6-v2
    batch_size: 32
    device: auto  # auto|cpu|cuda|mps