<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Hinbox{% endblock %} · Hinbox</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;0,8..60,700;1,8..60,400;1,8..60,600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
  <link rel="stylesheet" href="/static/styles.css">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect rx='18' width='100' height='100' fill='%232c5f7c'/%3E%3Ctext x='50' y='56' font-size='56' text-anchor='middle' dominant-baseline='middle' fill='white' font-family='Georgia,serif'%3EH%3C/text%3E%3C/svg%3E">
</head>
<body{% if static_site %} data-static="1"{% endif %}>
<div class="wrap">
  <header class="top">
    <a class="brand" href="{{ u('/') }}">Hin<span>box</span></a>
    <form class="search" action="/search" method="get" role="search"{% if static_site %} data-static-search{% endif %}>
      {% if domain != 'guantanamo' %}<input type="hidden" name="domain" value="{{ domain }}">{% endif %}
      <input type="search" name="q" value="{{ q }}" placeholder="Search people, organizations, places, events, sources…" aria-label="Search">
    </form>
    <nav class="nav" aria-label="Sections">
      {% for t in TABLES %}<a href="{{ u('/' ~ t.table) }}" {% if request.url.path.startswith('/' ~ t.table) %}aria-current="page"{% endif %}>{{ t.label }}</a>{% endfor %}
      <a href="{{ u('/sources') }}" {% if request.url.path.startswith('/sources') %}aria-current="page"{% endif %}>Sources</a>
    </nav>
    {% if domains|length > 1 and not static_site %}
    <form class="domain" action="/" method="get">
      <select name="domain" aria-label="Research domain" onchange="this.form.submit()">
        {% for d in domains %}<option value="{{ d }}" {% if d == domain %}selected{% endif %}>{{ d }}</option>{% endfor %}
      </select>
    </form>
    {% endif %}
  </header>
  {% block content %}{% endblock %}
</div>
{% block scripts %}{% endblock %}
{% if static_site %}<script src="/static/search-index.js" defer></script><script src="/static/static-search.js" defer></script>{% endif %}
</body>
</html>
