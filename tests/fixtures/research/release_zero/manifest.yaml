schema_version: 1
corpus:
  id: release-zero-rights-safe
  title: Release 0 rights-safe research contract fixture
  version: "2026-07-15.1"
  frozen_at: "2026-07-15"
  evaluation_scope: infrastructure_fidelity
  scope_note: >-
    All included records are synthetic. They test manifest, locator, conflict,
    qualifier, OCR-correction, and omission behavior. They provide no evidence
    about Mullah Abdul Salam Zaeef or any other historical person.
  frozen_order:
    - synthetic-account-a
    - synthetic-account-b
    - synthetic-image-page

sources:
  - import_key: synthetic-account-a
    title: Synthetic recollected account
    creator: Hinbox test authors
    source_type: synthetic_memoir_passage
    status: included
    expected_source_form: born_digital_text
    language: en
    evaluation_phenomena: [conflicting_date, material_qualifier]
    rights:
      redistribution: committed_test_fixture
      training_eligibility: synthetic_fixture_only
      note: Created for this repository; contains no historical claim.
    representations:
      - kind: original_text
        path: sources/account-a.txt
        sha256: e0fde30a8c3abfcb74a29fa2a0fe81897345c1d57b21ba0093c35008e5d36f02
        review_state: author_verified

  - import_key: synthetic-account-b
